<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}SEO-панель{% endblock %}</title>
  <link rel="stylesheet" href="{{ base }}/static/style.css">
</head>
<body data-base="{{ base }}"{% if refresh.running %} data-refreshing="1"{% endif %}>
{% if authed %}
<header class="top">
  <a class="brand" href="{{ base }}/">SEO-панель</a>
  <nav>
    <a href="{{ base }}/"{% if nav == 'overview' %} aria-current="page"{% endif %}>Сайты</a>
    <a href="{{ base }}/keywords"{% if nav == 'keywords' %} aria-current="page"{% endif %}>Ключевые слова</a>
    <a href="{{ base }}/connections"{% if nav == 'connections' %} aria-current="page"{% endif %}>Подключения</a>
  </nav>
  <div class="top-actions">
    <span class="muted" id="refresh-note">
      {% if refresh.running %}Обновляется… {{ refresh.step }}{% else %}Обновлено: {{ last_refresh|when }}{% endif %}
    </span>
    <form method="post" action="{{ base }}/refresh">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="back" value="{{ request.url.path }}">
      <button type="submit"{% if refresh.running %} disabled{% endif %}>Обновить данные</button>
    </form>
    <form method="post" action="{{ base }}/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="ghost">Выйти</button>
    </form>
  </div>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
<script src="{{ base }}/static/app.js" defer></script>
</body>
</html>
