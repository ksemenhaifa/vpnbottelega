# /etc/nginx/sites-available/strizhi-water
# Замените strizhi.example.ru на ваш домен. Без домена уберите server_name
# и слушайте 80 на IP сервера.

server {
    listen 80;
    listen [::]:80;
    server_name strizhi.example.ru;

    # certbot --nginx -d strizhi.example.ru добавит сюда TLS и редирект на https

    access_log /var/log/nginx/strizhi-water.access.log;
    error_log  /var/log/nginx/strizhi-water.error.log;

    # Ограничение записи показаний на уровне прокси (в дополнение к RATE_LIMIT)
    location /api/readings {
        limit_req zone=strizhi_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Эту строку добавьте в http { } в /etc/nginx/nginx.conf:
# limit_req_zone $binary_remote_addr zone=strizhi_api:10m rate=6r/m;
